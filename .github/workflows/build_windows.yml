name: Build Z-1080 for Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build CLI EXE
        run: |
          pyinstaller --onefile --name Z1080_CLI z1080.py

      - name: Build GUI EXE
        run: |
          pyinstaller --onefile --windowed --name Z1080_GUI z1080_gui.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Z1080_Windows_builds
          path: |
            dist/Z1080_CLI.exe
            dist/Z1080_GUI.exe
