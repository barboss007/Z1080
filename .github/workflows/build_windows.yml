name: Build Z1080 Secure Vault for Windows

on:
  push:
    branches: ["main", "phase2-z1080-vault-format"]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    # Використовуємо PowerShell для зручних `\` у командах
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pyinstaller

      # ---- Build CLI EXE ----
      - name: Build CLI executable
        run: |
          pyinstaller `
            --onefile `
            --name Z1080_CLI `
            --hidden-import cryptography `
            src/z1080/cli.py

      # ---- Build GUI EXE ----
      - name: Build GUI executable
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name Z1080_GUI `
            --hidden-import cryptography `
            src/z1080/gui.py

      # ---- Save Built Artifacts ----
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Z1080-build
          path: |
            dist/Z1080_CLI.exe
            dist/Z1080_GUI.exe